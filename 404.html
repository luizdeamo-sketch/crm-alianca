<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Torre de Controle</title><meta name="robots" content="noindex"><script>(function(){var p=location.pathname.replace(/\/+$/,"").split("/");var slug=(p.pop()||"").toLowerCase();var base=p.join("/")+"/";if(/^[a-z0-9][a-z0-9-]{1,40}$/.test(slug)){location.replace(base+"?c="+encodeURIComponent(slug)+location.hash);}else{location.replace(base);}})();</script></head><body><p>Abrindo a Torre de Controle…</p></body></html>
