<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plataforma · Torre de Controle by Capacity Case</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --g:#111827; --d:#9c7518; --dl:#d7aa42; --tx:#2a3540; --mu:#5d6871; --ln:#e4e6e2; --bg:#f6f6f3; --ok:#276b43; --okb:#e3f1e8; --er:#9e2f24; --erb:#f8e3e0; --at:#7a5b10; --atb:#f6ebd2; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 'Segoe UI', system-ui, sans-serif; color:var(--tx); background:var(--bg); }
  header { background:var(--g); color:#f4eee6; padding:16px 24px; display:flex; flex-wrap:wrap; gap:10px 24px; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:20px; } header h1 span { color:var(--dl); }
  header small { color:#9aa5b4; }
  main { padding:24px; display:grid; gap:22px; }
  .card { background:#fff; border:1px solid var(--ln); border-radius:14px; padding:20px 22px; }
  .card h2 { margin:0 0 4px; font-size:18px; color:var(--g); }
  .card p.sub { margin:0 0 14px; color:var(--mu); font-size:14px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  .kpi { background:#fff; border:1px solid var(--ln); border-radius:12px; padding:14px 16px; }
  .kpi b { display:block; font-size:26px; color:var(--g); } .kpi span { color:var(--mu); font-size:13px; }
  form.nova { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; align-items:end; }
  label { display:grid; gap:5px; font-size:13px; color:var(--g); }
  input, select { font:inherit; min-height:42px; padding:0 12px; border:1px solid #d5d8d2; border-radius:8px; background:#fff; width:100%; }
  button { font:inherit; min-height:42px; padding:0 16px; border-radius:8px; border:1px solid #d5d8d2; background:#fff; cursor:pointer; }
  button.pri { background:var(--g); color:#fff; border-color:var(--g); font-weight:600; }
  button.warn { color:var(--er); border-color:#e7b9b3; }
  .tbl { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:900px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--ln); vertical-align:middle; }
  th { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mu); background:#fafaf8; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .ok { background:var(--okb); color:var(--ok); } .susp { background:var(--erb); color:var(--er); } .pend { background:var(--atb); color:var(--at); }
  .acoes { display:flex; flex-wrap:wrap; gap:6px; }
  .acoes button, .acoes select { min-height:36px; font-size:13px; padding:0 10px; width:auto; }
  .tbl select { min-width:170px; min-height:36px; font-size:13px; }
  .logo { width:34px; height:34px; object-fit:contain; border-radius:6px; background:#fff; border:1px solid var(--ln); vertical-align:middle; margin-right:8px; }
  #msg { min-height:20px; font-size:14px; }
  .aviso { background:var(--atb); color:var(--g); border-radius:10px; padding:12px 14px; font-size:14px; }
  pre.convite { white-space:pre-wrap; background:var(--bg); border:1px solid var(--ln); border-radius:10px; padding:12px 14px; margin:10px 0; font-family:inherit; font-size:14px; line-height:1.5; }
  .bloq { max-width:none; text-align:center; padding:60px 24px; }
</style>
</head>
<body>
<header>
  <div><h1>Plataforma <span>· Torre de Controle</span></h1><small>Corretoras, planos e acessos. Nenhum dado de cliente aparece aqui.</small></div>
  <div id="quem" style="font-size:14px;color:#c9cfd8;"></div>
</header>
<main id="conteudo"><div class="card bloq">Carregando…</div></main>

<script>
const SUPABASE_URL = 'https://iuotvottnailofxbaynx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1b3R2b3R0bmFpbG9meGJheW54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1Mjg2NjMsImV4cCI6MjEwODEwNDY2M30._0FhywQ4Vq3km5Rl4tHEPtCLBVom4VAGaXG3X3nrUyQ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LINK_SISTEMA = new URL('./', location.href).href;
const PLANOS = { vendas: 'Módulo de Vendas', completo: 'Sistema completo' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const data = (d) => d ? new Date(d).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';

async function iniciar() {
  const { data: s } = await sb.auth.getSession();
  if (!s || !s.session) {
    $('#conteudo').innerHTML = `<div class="card bloq"><h2>Entre no sistema primeiro</h2><p class="sub">O Painel da Plataforma usa o mesmo login do sistema.</p><p><a href="${esc(LINK_SISTEMA)}">Abrir o sistema</a></p></div>`;
    return;
  }
  $('#quem').textContent = s.session.user.email;
  const { data: dono } = await sb.rpc('crm_dono_plataforma');
  if (dono !== true) {
    $('#conteudo').innerHTML = `<div class="card bloq"><h2>Acesso só para o dono da plataforma</h2><p class="sub">Se você administra uma corretora, use "Minha corretora" dentro do sistema.</p></div>`;
    return;
  }
  desenhar();
}

async function desenhar(aviso) {
  const { data: lista, error } = await sb.rpc('crm_plataforma_corretoras');
  if (error) { $('#conteudo').innerHTML = `<div class="card">Erro ao carregar: ${esc(error.message)}</div>`; return; }
  const ativas = lista.filter((c) => c.ativo);
  const usuarios = lista.reduce((a, c) => a + Number(c.usuarios_ativos || 0), 0);
  const pend = lista.filter((c) => c.primeiro_acesso_pendente).length;
  $('#conteudo').innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${ativas.length}</b><span>corretoras ativas</span></div>
      <div class="kpi"><b>${lista.length - ativas.length}</b><span>suspensas</span></div>
      <div class="kpi"><b>${usuarios}</b><span>usuários ativos</span></div>
      <div class="kpi"><b>${pend}</b><span>aguardando o 1º acesso</span></div>
    </div>
    ${aviso || ''}
    <div class="card">
      <h2>Nova corretora</h2>
      <p class="sub">Cria a corretora e libera o administrador dela por 48 horas para criar a senha em "Primeiro acesso". Depois ele mesmo sobe o logo e cadastra a equipe.</p>
      <form class="nova" id="f-nova">
        <label>Nome da corretora<input name="nome" required maxlength="60" placeholder="Ex.: Bravita"></label>
        <label>Plano<select name="plano"><option value="completo">Sistema completo</option><option value="vendas">Módulo de Vendas</option></select></label>
        <label>Nome do administrador<input name="admin_nome" maxlength="80"></label>
        <label>E-mail do administrador<input name="admin_email" type="email" required></label>
        <button class="pri" type="submit">Criar corretora</button>
      </form>
      <div id="msg"></div>
    </div>
    <div class="card">
      <h2>Corretoras</h2>
      <p class="sub">Suspender corta o acesso de toda a equipe da corretora; os dados ficam guardados e voltam ao reativar.</p>
      <div class="tbl"><table>
        <thead><tr><th>Corretora</th><th>Plano</th><th>Situação</th><th>Usuários</th><th>Último acesso</th><th>Administrador</th><th>Desde</th><th>Ações</th></tr></thead>
        <tbody>${lista.map(linha).join('')}</tbody>
      </table></div>
    </div>`;
  $('#f-nova').addEventListener('submit', criar);
  document.querySelectorAll('[data-acao]').forEach((b) => b.addEventListener('click', acao));
  document.querySelectorAll('select[data-plano]').forEach((s) => s.addEventListener('change', mudarPlano));
}

function linha(c) {
  const sit = !c.ativo ? '<span class="pill susp">Suspensa</span>' : c.primeiro_acesso_pendente ? '<span class="pill pend">Aguardando 1º acesso</span>' : '<span class="pill ok">Ativa</span>';
  const opts = Object.entries(PLANOS).map(([k, v]) => `<option value="${k}" ${c.plano === k ? 'selected' : ''}>${v}</option>`).join('');
  return `<tr>
    <td>${c.logo_url ? `<img class="logo" src="${esc(c.logo_url)}" alt="">` : ''}<b>${esc(c.nome_exibicao || c.nome)}</b></td>
    <td><select data-plano="${c.id}">${PLANOS[c.plano] ? '' : `<option selected>${esc(c.plano || '—')}</option>`}${opts}</select></td>
    <td>${sit}</td>
    <td>${c.usuarios_ativos} de ${c.usuarios}</td>
    <td>${data(c.ultimo_acesso)}</td>
    <td>${esc(c.admin_email || '—')}</td>
    <td>${c.criado_em ? new Date(c.criado_em).toLocaleDateString('pt-BR') : '—'}</td>
    <td><div class="acoes">
      ${c.admin_email ? `<button data-acao="liberar" data-id="${c.id}" data-nome="${esc(c.nome_exibicao || c.nome)}" data-email="${esc(c.admin_email)}">Liberar 1º acesso (48h)</button>` : ''}
      ${c.ativo ? `<button class="warn" data-acao="suspender" data-id="${c.id}" data-nome="${esc(c.nome_exibicao || c.nome)}">Suspender</button>` : `<button data-acao="reativar" data-id="${c.id}">Reativar</button>`}
    </div></td></tr>`;
}

function convite(nome, email) {
  const txt = `Olá! A Torre de Controle - ${nome} está pronta para você.\n\n1. Abra ${LINK_SISTEMA}\n2. Clique em "Primeiro acesso: criar minha senha" e use o e-mail ${email}\n3. Crie sua senha e ative a confirmação em 2 etapas\n4. Em "Minha corretora", suba o logo e escolha as cores\n5. Em Admin, cadastre a sua equipe\n\nO link para criar a senha vale por 48 horas.`;
  return `<div class="aviso"><b>Pronto. Mande esta mensagem para o administrador:</b>
    <pre class="convite">${esc(txt)}</pre>
    <div class="acoes"><button type="button" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(txt))}).then(()=>this.textContent='Copiado ✓')">Copiar mensagem</button>
    <a href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener"><button type="button">Enviar pelo WhatsApp</button></a></div></div>`;
}

async function criar(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  $('#msg').textContent = 'Criando…';
  const { error } = await sb.rpc('crm_plataforma_criar', { p_nome: f.get('nome'), p_plano: f.get('plano'), p_admin_email: f.get('admin_email'), p_admin_nome: f.get('admin_nome') });
  if (error) { $('#msg').textContent = 'Não foi possível criar: ' + error.message; return; }
  desenhar(convite(String(f.get('nome')).trim(), String(f.get('admin_email')).trim().toLowerCase()));
}

async function acao(e) {
  const b = e.currentTarget, id = b.dataset.id;
  if (b.dataset.acao === 'suspender' && !confirm(`Suspender ${b.dataset.nome}? Toda a equipe perde o acesso até você reativar. Os dados ficam guardados.`)) return;
  let r;
  if (b.dataset.acao === 'liberar') r = await sb.rpc('crm_plataforma_liberar_admin', { p_id: id });
  else r = await sb.rpc('crm_plataforma_atualizar', { p_id: id, p_plano: null, p_ativo: b.dataset.acao === 'reativar', p_observacao: null });
  if (r.error) { alert(r.error.message); return; }
  desenhar(b.dataset.acao === 'liberar' ? convite(b.dataset.nome, b.dataset.email) : '');
}

async function mudarPlano(e) {
  const { error } = await sb.rpc('crm_plataforma_atualizar', { p_id: e.target.dataset.plano, p_plano: e.target.value, p_ativo: null, p_observacao: null });
  if (error) alert(error.message);
}

iniciar();
</script>
</body>
</html>
